<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Announcements – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('announcements')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>📢 Announcements</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/announcements/add}" class="btn btn-primary btn-sm">+ New Announcement</a>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

            <div class="card">
                <div class="card-header"><h3>All Announcements</h3></div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Content</th>
                                <th>Priority</th>
                                <th>Posted By</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ann, stat : ${announcements}">
                                <td th:text="${stat.count}"></td>
                                <td style="font-weight:600;" th:text="${ann.title}"></td>
                                <td style="max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                                    th:text="${ann.content}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${ann.priority=='HIGH'} ? 'badge-danger' : (${ann.priority=='MEDIUM'} ? 'badge-warning' : 'badge-secondary')"
                                          th:text="${ann.priority}"></span>
                                </td>
                                <td th:text="${ann.postedBy}"></td>
                                <td th:text="${ann.postedOn}"></td>
                                <td>
                                    <div class="flex-gap">
                                        <a th:href="@{/admin/announcements/edit/{id}(id=${ann.id})}" class="btn btn-warning btn-xs">✏️ Edit</a>
                                        <a th:href="@{/admin/announcements/delete/{id}(id=${ann.id})}"
                                           class="btn btn-danger btn-xs"
                                           onclick="return confirm('Delete this announcement?')">🗑 Delete</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(announcements)}">
                                <td colspan="7" style="text-align:center;padding:32px;color:#64748b;">
                                    No announcements yet. <a th:href="@{/admin/announcements/add}">Post one?</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
