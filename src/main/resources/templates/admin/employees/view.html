<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>View Employee – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('employees')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>👁 Employee Details</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning btn-sm">✏️ Edit</a>
                <a th:href="@{/admin/employees}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <div class="profile-header">
                <div class="profile-avatar" th:text="${employee.firstName.substring(0,1)}"></div>
                <div class="profile-info">
                    <h2 th:text="${employee.fullName}"></h2>
                    <p th:text="${employee.designation}"></p>
                    <p th:text="${employee.department != null ? employee.department.name : ''}"></p>
                    <span class="badge"
                          th:classappend="${employee.status == 'ACTIVE'} ? 'badge-success' : 'badge-danger'"
                          th:text="${employee.status}" style="margin-top:6px;"></span>
                </div>
            </div>

            <div class="dash-grid">
                <div class="card">
                    <div class="card-header"><h3>👤 Personal Details</h3></div>
                    <div class="card-body">
                        <div class="info-grid">
                            <div class="info-item">
                                <label>Employee Code</label>
                                <p th:text="${employee.employeeCode}"></p>
                            </div>
                            <div class="info-item">
                                <label>Email</label>
                                <p th:text="${employee.email}"></p>
                            </div>
                            <div class="info-item">
                                <label>Phone</label>
                                <p th:text="${employee.phone ?: '-'}"></p>
                            </div>
                            <div class="info-item">
                                <label>Gender</label>
                                <p th:text="${employee.gender ?: '-'}"></p>
                            </div>
                            <div class="info-item">
                                <label>Date of Birth</label>
                                <p th:text="${employee.dateOfBirth ?: '-'}"></p>
                            </div>
                            <div class="info-item">
                                <label>Join Date</label>
                                <p th:text="${employee.joinDate ?: '-'}"></p>
                            </div>
                            <div class="info-item" style="grid-column:1/-1;">
                                <label>Address</label>
                                <p th:text="${employee.address ?: '-'}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h3>💼 Job Details</h3></div>
                    <div class="card-body">
                        <div class="info-grid">
                            <div class="info-item">
                                <label>Designation</label>
                                <p th:text="${employee.designation}"></p>
                            </div>
                            <div class="info-item">
                                <label>Department</label>
                                <p th:text="${employee.department != null ? employee.department.name : '-'}"></p>
                            </div>
                            <div class="info-item">
                                <label>Basic Salary</label>
                                <p style="font-weight:700;color:#0ea5e9;">₹ <span th:text="${#numbers.formatDecimal(employee.basicSalary,1,'COMMA',2,'POINT')}"></span></p>
                            </div>
                            <div class="info-item">
                                <label>Status</label>
                                <p>
                                    <span class="badge"
                                          th:classappend="${employee.status == 'ACTIVE'} ? 'badge-success' : 'badge-danger'"
                                          th:text="${employee.status}"></span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top:16px;display:flex;gap:10px;">
                <a th:href="@{/admin/employees/edit/{id}(id=${employee.id})}" class="btn btn-warning">✏️ Edit Employee</a>
                <a th:href="@{/admin/employees/delete/{id}(id=${employee.id})}"
                   class="btn btn-danger"
                   onclick="return confirm('Are you sure you want to delete this employee?')">🗑 Delete</a>
                <a th:href="@{/admin/employees/idcard/{id}(id=${employee.id})}" class="btn btn-outline">🪪 View ID Card</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
