<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('employees')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>➕ Add Employee</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/employees}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${error}" class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <form th:action="@{/admin/employees/add}" method="post">
                <div class="card" style="margin-bottom:20px;">
                    <div class="card-header"><h3>👤 Personal Information</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>First Name *</label>
                                <input type="text" name="firstName" class="form-control" required placeholder="First name">
                            </div>
                            <div class="form-group">
                                <label>Last Name *</label>
                                <input type="text" name="lastName" class="form-control" required placeholder="Last name">
                            </div>
                            <div class="form-group">
                                <label>Email *</label>
                                <input type="email" name="email" class="form-control" required placeholder="employee@company.com">
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="text" name="phone" class="form-control" placeholder="Mobile number">
                            </div>
                            <div class="form-group">
                                <label>Gender</label>
                                <select name="gender" class="form-control">
                                    <option value="">Select Gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" name="dateOfBirth" class="form-control">
                            </div>
                            <div class="form-group form-full">
                                <label>Address</label>
                                <textarea name="address" class="form-control" placeholder="Full address"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-bottom:20px;">
                    <div class="card-header"><h3>💼 Job Information</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Designation *</label>
                                <input type="text" name="designation" class="form-control" required placeholder="e.g. Software Engineer">
                            </div>
                            <div class="form-group">
                                <label>Department *</label>
                                <select name="departmentId" class="form-control" required>
                                    <option value="">Select Department</option>
                                    <option th:each="dept : ${departments}"
                                            th:value="${dept.id}"
                                            th:text="${dept.name}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Join Date</label>
                                <input type="date" name="joinDate" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Basic Salary (₹)</label>
                                <input type="number" name="basicSalary" class="form-control" placeholder="0.00" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select name="status" class="form-control">
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-bottom:20px;">
                    <div class="card-header"><h3>🔐 Login Credentials</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Username *</label>
                                <input type="text" name="username" class="form-control" required placeholder="Login username">
                            </div>
                            <div class="form-group">
                                <label>Password *</label>
                                <input type="password" name="password" class="form-control" required placeholder="Login password">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex-gap">
                    <button type="submit" class="btn btn-primary">✅ Save Employee</button>
                    <a th:href="@{/admin/employees}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
