<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('departments')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1 th:text="${department.id != null} ? '✏️ Edit Department' : '➕ Add Department'"></h1>
            <div class="topbar-right">
                <a th:href="@{/admin/departments}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <div class="card" style="max-width:600px;">
                <div class="card-header">
                    <h3 th:text="${department.id != null} ? 'Edit Department' : 'New Department'"></h3>
                </div>
                <div class="card-body">
                    <form th:action="${department.id != null} ? @{/admin/departments/edit/{id}(id=${department.id})} : @{/admin/departments/add}"
                          method="post">
                        <div class="form-group mb-4">
                            <label>Department Name *</label>
                            <input type="text" name="name" class="form-control"
                                   th:value="${department.name}" required placeholder="e.g. Information Technology">
                        </div>
                        <div class="form-group mb-4">
                            <label>Description</label>
                            <textarea name="description" class="form-control" rows="3"
                                      th:text="${department.description}"
                                      placeholder="Brief description of this department"></textarea>
                        </div>
                        <div class="form-group mb-4">
                            <label>Head of Department</label>
                            <input type="text" name="hodName" class="form-control"
                                   th:value="${department.hodName}" placeholder="HOD Name">
                        </div>
                        <div class="flex-gap">
                            <button type="submit" class="btn btn-primary">💾 Save</button>
                            <a th:href="@{/admin/departments}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
