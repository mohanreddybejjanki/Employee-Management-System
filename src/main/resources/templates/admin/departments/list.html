<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Departments – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('departments')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>🏬 Departments</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/departments/add}" class="btn btn-primary btn-sm">+ Add Department</a>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}"   class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <div class="card">
                <div class="card-header"><h3>All Departments</h3></div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Department Name</th>
                                <th>Description</th>
                                <th>Head of Department</th>
                                <th>Employees</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="dept, stat : ${departments}">
                                <td th:text="${stat.count}"></td>
                                <td><strong th:text="${dept.name}"></strong></td>
                                <td th:text="${dept.description ?: '-'}"></td>
                                <td th:text="${dept.hodName ?: '-'}"></td>
                                <td>
                                    <span class="badge badge-primary"
                                          th:text="${dept.employees != null ? dept.employees.size() : 0}"></span>
                                </td>
                                <td>
                                    <div class="flex-gap">
                                        <a th:href="@{/admin/departments/edit/{id}(id=${dept.id})}" class="btn btn-warning btn-xs">✏️ Edit</a>
                                        <a th:href="@{/admin/departments/delete/{id}(id=${dept.id})}"
                                           class="btn btn-danger btn-xs"
                                           onclick="return confirm('Delete this department?')">🗑 Delete</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(departments)}">
                                <td colspan="6" style="text-align:center;padding:32px;color:#64748b;">
                                    No departments yet. <a th:href="@{/admin/departments/add}">Add one?</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
