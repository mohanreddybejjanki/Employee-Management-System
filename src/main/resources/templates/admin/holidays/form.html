<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Holiday Form – EMP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('holidays')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>🎉 Add / Edit Holiday</h1>
            <div class="topbar-right"><a th:href="@{/admin/holidays}" class="btn btn-secondary btn-sm">← Back</a></div>
        </div>
        <div class="page-body">
            <div class="card" style="max-width:600px;">
                <div class="card-header"><h3>Holiday Details</h3></div>
                <div class="card-body">
                    <form th:action="${holiday.id != null} ? @{/admin/holidays/edit/{id}(id=${holiday.id})} : @{/admin/holidays/add}" method="post">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Holiday Name *</label>
                                <input type="text" name="name" class="form-control" th:value="${holiday.name}" required>
                            </div>
                            <div class="form-group">
                                <label>Date *</label>
                                <input type="date" name="date" class="form-control" th:value="${holiday.date}" required>
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <select name="type" class="form-control">
                                    <option value="NATIONAL"  th:selected="${holiday.type=='NATIONAL'}">National</option>
                                    <option value="FESTIVAL"  th:selected="${holiday.type=='FESTIVAL'}">Festival</option>
                                    <option value="OPTIONAL"  th:selected="${holiday.type=='OPTIONAL'}">Optional</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Description</label>
                                <input type="text" name="description" class="form-control" th:value="${holiday.description}">
                            </div>
                        </div>
                        <div class="flex-gap" style="margin-top:16px;">
                            <button type="submit" class="btn btn-primary">💾 Save</button>
                            <a th:href="@{/admin/holidays}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
