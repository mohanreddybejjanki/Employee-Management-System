<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{employee/sidebar :: sidebar('profile')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>👤 My Profile</h1>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}"   class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <div class="profile-header">
                <div class="profile-avatar" th:text="${employee.firstName.substring(0,1)}"></div>
                <div class="profile-info">
                    <h2 th:text="${employee.fullName}"></h2>
                    <p th:text="${employee.designation} + ' | ' + (${employee.department != null ? employee.department.name : 'N/A'})"></p>
                    <p style="margin-top:6px;">
                        <span class="badge badge-success">Active</span>
                        &nbsp;
                        <span class="badge badge-primary" th:text="${employee.employeeCode}"></span>
                    </p>
                </div>
            </div>

            <div class="dash-grid">
                <!-- View Info -->
                <div class="card">
                    <div class="card-header"><h3>📋 Personal Details</h3></div>
                    <div class="card-body">
                        <div class="info-grid">
                            <div class="info-item"><label>Full Name</label><p th:text="${employee.fullName}"></p></div>
                            <div class="info-item"><label>Email</label><p th:text="${employee.email}"></p></div>
                            <div class="info-item"><label>Phone</label><p th:text="${employee.phone ?: '-'}"></p></div>
                            <div class="info-item"><label>Gender</label><p th:text="${employee.gender ?: '-'}"></p></div>
                            <div class="info-item"><label>Date of Birth</label><p th:text="${employee.dateOfBirth ?: '-'}"></p></div>
                            <div class="info-item"><label>Join Date</label><p th:text="${employee.joinDate ?: '-'}"></p></div>
                            <div class="info-item" style="grid-column:1/-1;"><label>Address</label><p th:text="${employee.address ?: '-'}"></p></div>
                        </div>
                    </div>
                </div>

                <!-- Edit Editable Fields -->
                <div style="display:flex;flex-direction:column;gap:20px;">
                    <div class="card">
                        <div class="card-header"><h3>✏️ Update Contact Info</h3></div>
                        <div class="card-body">
                            <form th:action="@{/employee/profile/update}" method="post">
                                <div class="form-group mb-4">
                                    <label>Phone</label>
                                    <input type="text" name="phone" class="form-control" th:value="${employee.phone}">
                                </div>
                                <div class="form-group mb-4">
                                    <label>Address</label>
                                    <textarea name="address" class="form-control" rows="3" th:text="${employee.address}"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-sm">💾 Update</button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><h3>🔐 Change Password</h3></div>
                        <div class="card-body">
                            <form th:action="@{/employee/change-password}" method="post">
                                <div class="form-group mb-4">
                                    <label>Current Password</label>
                                    <input type="password" name="oldPassword" class="form-control" required>
                                </div>
                                <div class="form-group mb-4">
                                    <label>New Password</label>
                                    <input type="password" name="newPassword" class="form-control" required>
                                </div>
                                <div class="form-group mb-4">
                                    <label>Confirm New Password</label>
                                    <input type="password" name="confirmPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-warning btn-sm">🔑 Change Password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
