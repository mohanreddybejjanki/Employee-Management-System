<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Overtime – EMP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="layout">
    <div th:replace="~{employee/sidebar :: sidebar('overtime')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>⏰ My Overtime</h1>
            <div class="topbar-right"><span class="badge-pill" th:text="${employee.fullName}"></span></div>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

            <div class="dash-grid">
                <div class="card">
                    <div class="card-header"><h3>Apply for Overtime</h3></div>
                    <div class="card-body">
                        <form th:action="@{/employee/overtime/apply}" method="post">
                            <div class="form-group mb-4">
                                <label>Date *</label>
                                <input type="date" name="date" class="form-control" required>
                            </div>
                            <div class="form-group mb-4">
                                <label>Hours *</label>
                                <input type="number" name="hours" class="form-control" step="0.5" min="0.5" max="12" required placeholder="e.g. 2.5">
                            </div>
                            <div class="form-group mb-4">
                                <label>Reason *</label>
                                <textarea name="reason" class="form-control" required placeholder="Reason for overtime..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">📤 Submit Request</button>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h3>My Overtime History</h3></div>
                    <div class="table-responsive">
                        <table>
                            <thead><tr><th>Date</th><th>Hours</th><th>Status</th></tr></thead>
                            <tbody>
                            <tr th:each="o : ${overtimes}">
                                <td th:text="${o.date}"></td>
                                <td th:text="${o.hours} + ' hrs'"></td>
                                <td>
                                        <span class="badge"
                                              th:classappend="${o.status=='APPROVED'} ? 'badge-success' : (${o.status=='REJECTED'} ? 'badge-danger' : 'badge-warning')"
                                              th:text="${o.status}"></span>
                                </td>
                            </tr>
                            <tr th:if="${overtimes == null or #lists.isEmpty(overtimes)}">
                                <td colspan="3" style="text-align:center;padding:20px;color:#64748b;">No overtime records.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
