<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply Leave – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{employee/sidebar :: sidebar('leaves')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>📅 Apply for Leave</h1>
            <div class="topbar-right">
                <a th:href="@{/employee/leaves}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <div class="card" style="max-width:600px;">
                <div class="card-header"><h3>Leave Application</h3></div>
                <div class="card-body">
                    <form th:action="@{/employee/leaves/apply}" method="post">
                        <div class="form-group mb-4">
                            <label>Leave Type *</label>
                            <select name="leaveType" class="form-control" required>
                                <option value="">-- Select Type --</option>
                                <option value="CASUAL">Casual Leave</option>
                                <option value="SICK">Sick Leave</option>
                                <option value="EARNED">Earned Leave</option>
                                <option value="MATERNITY">Maternity Leave</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>From Date *</label>
                                <input type="date" name="fromDate" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>To Date *</label>
                                <input type="date" name="toDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group mb-4" style="margin-top:16px;">
                            <label>Reason *</label>
                            <textarea name="reason" class="form-control" rows="4" required
                                      placeholder="Please provide the reason for leave..."></textarea>
                        </div>
                        <div class="flex-gap">
                            <button type="submit" class="btn btn-primary">📤 Submit Application</button>
                            <a th:href="@{/employee/leaves}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
