<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Salary – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{employee/sidebar :: sidebar('salary')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>💰 My Salary</h1>
            <div class="topbar-right">
                <span class="badge-pill" th:text="${employee != null ? employee.fullName : ''}"></span>
            </div>
        </div>
        <div class="page-body">

            <!-- Salary summary cards -->
            <div class="stats-grid" th:if="${employee != null}">
                <div class="stat-card">
                    <div class="stat-icon sky">💵</div>
                    <div class="stat-info">
                        <h3 th:text="'₹' + ${#numbers.formatDecimal(employee.basicSalary,1,'COMMA',0,'POINT')}">₹0</h3>
                        <p>Basic Salary</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">📄</div>
                    <div class="stat-info">
                        <h3 th:text="${salaries != null ? salaries.size() : 0}">0</h3>
                        <p>Payslips Available</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue">🏢</div>
                    <div class="stat-info">
                        <h3 th:text="${employee.department != null ? employee.department.name : '-'}">-</h3>
                        <p>Department</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">📅</div>
                    <div class="stat-info">
                        <h3 th:text="${employee.designation}">-</h3>
                        <p>Designation</p>
                    </div>
                </div>
            </div>

            <!-- No salary records yet -->
            <div th:if="${salaries == null or salaries.isEmpty()}" class="card">
                <div class="card-body">
                    <div class="empty-state">
                        <div class="icon">💰</div>
                        <p>No salary records yet.</p>
                        <p style="margin-top:6px;font-size:.8rem;color:#94a3b8;">Your admin will generate your monthly salary from the admin panel.</p>
                    </div>
                </div>
            </div>

            <!-- Salary table -->
            <div class="card" th:if="${salaries != null and !salaries.isEmpty()}">
                <div class="card-header"><h3>📋 Salary History</h3></div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Month / Year</th>
                                <th>Basic</th>
                                <th>HRA</th>
                                <th>DA</th>
                                <th>Deductions</th>
                                <th>Net Salary</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sal, stat : ${salaries}">
                                <td th:text="${stat.count}"></td>
                                <td>
                                    <strong th:text="${sal.month} + ' / ' + ${sal.year}"></strong>
                                </td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.basicSalary,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.hra,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.da,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.pf + sal.tax + sal.otherDeductions,1,'COMMA',0,'POINT')}"></td>
                                <td style="font-weight:700;color:#0284c7;"
                                    th:text="'₹' + ${#numbers.formatDecimal(sal.netSalary,1,'COMMA',0,'POINT')}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${sal.status=='PAID'} ? 'badge-success' : 'badge-warning'"
                                          th:text="${sal.status}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/employee/salary/payslip/{id}(id=${sal.id})}"
                                       class="btn btn-primary btn-xs">📄 Payslip</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
