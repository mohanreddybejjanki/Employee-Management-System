<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Announcements – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{employee/sidebar :: sidebar('announcements')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>📢 Announcements</h1>
            <div class="topbar-right">
                <span class="badge-pill" th:text="${employee.fullName}"></span>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${#lists.isEmpty(announcements)}" class="empty-state">
                <div class="icon">📢</div>
                <p>No announcements at this time.</p>
            </div>

            <div th:each="ann : ${announcements}" class="card" style="margin-bottom:16px;">
                <div class="card-body">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
                        <h3 style="font-size:1.05rem;font-weight:700;color:#1e293b;" th:text="${ann.title}"></h3>
                        <span class="badge"
                              th:classappend="${ann.priority == 'HIGH'} ? 'badge-danger' : (${ann.priority == 'MEDIUM'} ? 'badge-warning' : 'badge-secondary')"
                              th:text="${ann.priority}"></span>
                    </div>
                    <p style="color:#475569;line-height:1.7;font-size:.9rem;" th:text="${ann.content}"></p>
                    <div style="margin-top:12px;font-size:.75rem;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px;">
                        Posted by <strong th:text="${ann.postedBy}"></strong>
                        on <span th:text="${ann.postedOn}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
