<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('employees')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>✏️ Edit Employee</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/employees}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <form th:action="@{/admin/employees/edit/{id}(id=${employee.id})}" method="post">
                <div class="card" style="margin-bottom:20px;">
                    <div class="card-header"><h3>👤 Personal Information</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>First Name *</label>
                                <input type="text" name="firstName" class="form-control" th:value="${employee.firstName}" required>
                            </div>
                            <div class="form-group">
                                <label>Last Name *</label>
                                <input type="text" name="lastName" class="form-control" th:value="${employee.lastName}" required>
                            </div>
                            <div class="form-group">
                                <label>Email *</label>
                                <input type="email" name="email" class="form-control" th:value="${employee.email}" required>
                            </div>
                            <div class="form-group">
                                <label>Phone</label>
                                <input type="text" name="phone" class="form-control" th:value="${employee.phone}">
                            </div>
                            <div class="form-group">
                                <label>Gender</label>
                                <select name="gender" class="form-control">
                                    <option value="Male"   th:selected="${employee.gender == 'Male'}">Male</option>
                                    <option value="Female" th:selected="${employee.gender == 'Female'}">Female</option>
                                    <option value="Other"  th:selected="${employee.gender == 'Other'}">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Date of Birth</label>
                                <input type="date" name="dateOfBirth" class="form-control" th:value="${employee.dateOfBirth}">
                            </div>
                            <div class="form-group form-full">
                                <label>Address</label>
                                <textarea name="address" class="form-control" th:text="${employee.address}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card" style="margin-bottom:20px;">
                    <div class="card-header"><h3>💼 Job Information</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Designation *</label>
                                <input type="text" name="designation" class="form-control" th:value="${employee.designation}" required>
                            </div>
                            <div class="form-group">
                                <label>Department *</label>
                                <select name="departmentId" class="form-control" required>
                                    <option th:each="dept : ${departments}"
                                            th:value="${dept.id}" th:text="${dept.name}"
                                            th:selected="${employee.department != null && employee.department.id == dept.id}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Join Date</label>
                                <input type="date" name="joinDate" class="form-control" th:value="${employee.joinDate}">
                            </div>
                            <div class="form-group">
                                <label>Basic Salary (₹)</label>
                                <input type="number" name="basicSalary" class="form-control" th:value="${employee.basicSalary}" step="0.01">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select name="status" class="form-control">
                                    <option value="ACTIVE"   th:selected="${employee.status == 'ACTIVE'}">Active</option>
                                    <option value="INACTIVE" th:selected="${employee.status == 'INACTIVE'}">Inactive</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex-gap">
                    <button type="submit" class="btn btn-primary">💾 Update Employee</button>
                    <a th:href="@{/admin/employees}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
