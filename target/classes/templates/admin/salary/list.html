<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<head>
    <meta charset="UTF-8">
    <title>Salary – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('salary')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>💰 Salary & Payroll</h1>
            <div class="topbar-right">
                <a th:href="@{/admin/salary/generate}" class="btn btn-primary btn-sm">+ Generate Salary</a>
            </div>
        </div>
        <div class="page-body">
            <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>
            <div th:if="${error}"   class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>

            <!-- Month/Year filter -->
            <div class="card" style="margin-bottom:20px;">
                <div class="card-body" style="padding:14px 20px;">
                    <form th:action="@{/admin/salary}" method="get" class="flex-gap">
                        <label style="font-weight:600;">Month:</label>
                        <select name="month" class="form-control" style="width:140px;">
                            <option th:each="m : ${#numbers.sequence(1,12)}"
                                    th:value="${m}"
                                    th:text="${#temporals.format(#temporals.create(2024, m, 1), 'MMMM')}"
                                    th:selected="${m == selectedMonth}"></option>
                        </select>
                        <label style="font-weight:600;">Year:</label>
                        <select name="year" class="form-control" style="width:100px;">
                            <option th:each="y : ${#numbers.sequence(2022, 2026)}"
                                    th:value="${y}" th:text="${y}"
                                    th:selected="${y == selectedYear}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">🔍 Filter</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Salary Records</h3>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Employee</th>
                                <th>Month/Year</th>
                                <th>Basic</th>
                                <th>HRA</th>
                                <th>DA</th>
                                <th>Deductions</th>
                                <th>Net Salary</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sal, stat : ${salaries}">
                                <td th:text="${stat.count}"></td>
                                <td>
                                    <div style="font-weight:600;" th:text="${sal.employee.fullName}"></div>
                                    <div style="font-size:.75rem;color:#64748b;" th:text="${sal.employee.employeeCode}"></div>
                                </td>
                                <td th:text="${sal.month} + '/' + ${sal.year}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.basicSalary,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.hra,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.da,1,'COMMA',0,'POINT')}"></td>
                                <td th:text="'₹' + ${#numbers.formatDecimal(sal.pf + sal.tax + sal.otherDeductions,1,'COMMA',0,'POINT')}"></td>
                                <td style="font-weight:700;color:#0284c7;" th:text="'₹' + ${#numbers.formatDecimal(sal.netSalary,1,'COMMA',0,'POINT')}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${sal.status=='PAID'} ? 'badge-success' : 'badge-warning'"
                                          th:text="${sal.status}"></span>
                                </td>
                                <td>
                                    <div class="flex-gap">
                                        <a th:href="@{/admin/salary/payslip/{id}(id=${sal.id})}" class="btn btn-primary btn-xs">📄 Payslip</a>
                                        <form th:if="${sal.status=='PENDING'}" th:action="@{/admin/salary/pay/{id}(id=${sal.id})}" method="post" style="display:inline;">
                                            <button class="btn btn-success btn-xs">💳 Mark Paid</button>
                                        </form>
                                        <a th:href="@{/admin/salary/delete/{id}(id=${sal.id})}"
                                           class="btn btn-danger btn-xs"
                                           onclick="return confirm('Delete salary record?')">🗑</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(salaries)}">
                                <td colspan="10" style="text-align:center;padding:32px;color:#64748b;">
                                    No salary records for this period.
                                    <a th:href="@{/admin/salary/generate}">Generate now?</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
