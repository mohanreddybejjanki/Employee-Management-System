<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Announcement – EMP Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('announcements')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1 th:text="${announcement.id != null} ? '✏️ Edit Announcement' : '📢 New Announcement'"></h1>
            <div class="topbar-right">
                <a th:href="@{/admin/announcements}" class="btn btn-secondary btn-sm">← Back</a>
            </div>
        </div>
        <div class="page-body">
            <div class="card" style="max-width:640px;">
                <div class="card-header"><h3>Announcement Details</h3></div>
                <div class="card-body">
                    <form th:action="${announcement.id != null} ? @{/admin/announcements/edit/{id}(id=${announcement.id})} : @{/admin/announcements/add}"
                          method="post">
                        <div class="form-group mb-4">
                            <label>Title *</label>
                            <input type="text" name="title" class="form-control"
                                   th:value="${announcement.title}" required placeholder="Announcement title">
                        </div>
                        <div class="form-group mb-4">
                            <label>Content *</label>
                            <textarea name="content" class="form-control" rows="5" required
                                      placeholder="Write announcement details here..."
                                      th:text="${announcement.content}"></textarea>
                        </div>
                        <div class="form-group mb-4">
                            <label>Priority</label>
                            <select name="priority" class="form-control" style="max-width:200px;">
                                <option value="LOW"    th:selected="${announcement.priority=='LOW'}">🟢 Low</option>
                                <option value="MEDIUM" th:selected="${announcement.priority=='MEDIUM'}">🟡 Medium</option>
                                <option value="HIGH"   th:selected="${announcement.priority=='HIGH'}">🔴 High</option>
                            </select>
                        </div>
                        <div class="flex-gap">
                            <button type="submit" class="btn btn-primary">📢 Post Announcement</button>
                            <a th:href="@{/admin/announcements}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
