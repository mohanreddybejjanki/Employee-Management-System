<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Training – EMP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('training')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>🎓 Add Training</h1>
            <div class="topbar-right"><a th:href="@{/admin/training}" class="btn btn-secondary btn-sm">← Back</a></div>
        </div>
        <div class="page-body">
            <div class="card">
                <div class="card-header"><h3>Training Details</h3></div>
                <div class="card-body">
                    <form th:action="@{/admin/training/add}" method="post">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Employee *</label>
                                <select name="employeeId" class="form-control" required>
                                    <option value="">Select Employee</option>
                                    <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Training Name *</label>
                                <input type="text" name="trainingName" class="form-control" required placeholder="e.g. AWS Cloud Practitioner">
                            </div>
                            <div class="form-group">
                                <label>Provider</label>
                                <input type="text" name="provider" class="form-control" placeholder="e.g. Coursera, Udemy">
                            </div>
                            <div class="form-group">
                                <label>Start Date</label>
                                <input type="date" name="startDate" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>End Date</label>
                                <input type="date" name="endDate" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Status</label>
                                <select name="status" class="form-control">
                                    <option value="SCHEDULED">Scheduled</option>
                                    <option value="ONGOING">Ongoing</option>
                                    <option value="COMPLETED">Completed</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Certification Awarded?</label>
                                <select name="certification" class="form-control">
                                    <option value="NO">No</option>
                                    <option value="YES">Yes</option>
                                </select>
                            </div>
                            <div class="form-group form-full">
                                <label>Remarks</label>
                                <textarea name="remarks" class="form-control" placeholder="Additional notes..."></textarea>
                            </div>
                        </div>
                        <div class="flex-gap" style="margin-top:16px;">
                            <button type="submit" class="btn btn-primary">💾 Save Training</button>
                            <a th:href="@{/admin/training}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
