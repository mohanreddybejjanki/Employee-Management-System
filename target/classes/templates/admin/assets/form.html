<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Add Asset – EMP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<div class="sidebar-overlay" id="overlay"></div>
<script th:src="@{/js/app.js}"></script>
<body>
<div class="layout">
    <div th:replace="~{admin/sidebar :: sidebar('assets')}"></div>
    <div class="main-content">
        <div class="topbar">
            <h1>💻 Add Asset</h1>
            <div class="topbar-right"><a th:href="@{/admin/assets}" class="btn btn-secondary btn-sm">← Back</a></div>
        </div>
        <div class="page-body">
            <div class="card">
                <div class="card-header"><h3>Asset Details</h3></div>
                <div class="card-body">
                    <form th:action="@{/admin/assets/add}" method="post">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Asset Name *</label>
                                <input type="text" name="assetName" class="form-control" required placeholder="e.g. Dell Laptop">
                            </div>
                            <div class="form-group">
                                <label>Asset Code *</label>
                                <input type="text" name="assetCode" class="form-control" required placeholder="e.g. AST-001">
                            </div>
                            <div class="form-group">
                                <label>Asset Type</label>
                                <select name="assetType" class="form-control">
                                    <option value="LAPTOP">Laptop</option>
                                    <option value="MOBILE">Mobile</option>
                                    <option value="CHAIR">Chair</option>
                                    <option value="DESK">Desk</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Brand</label>
                                <input type="text" name="brand" class="form-control" placeholder="e.g. Dell, HP, Apple">
                            </div>
                            <div class="form-group">
                                <label>Serial Number</label>
                                <input type="text" name="serialNumber" class="form-control" placeholder="Serial / IMEI number">
                            </div>
                            <div class="form-group">
                                <label>Condition</label>
                                <select name="condition" class="form-control">
                                    <option value="GOOD">Good</option>
                                    <option value="DAMAGED">Damaged</option>
                                    <option value="UNDER_REPAIR">Under Repair</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Assign To Employee</label>
                                <select name="employeeId" class="form-control">
                                    <option value="">-- Not Assigned --</option>
                                    <option th:each="e : ${employees}" th:value="${e.id}" th:text="${e.fullName}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Assigned Date</label>
                                <input type="date" name="assignedDate" class="form-control">
                            </div>
                            <div class="form-group form-full">
                                <label>Remarks</label>
                                <textarea name="remarks" class="form-control"></textarea>
                            </div>
                        </div>
                        <div class="flex-gap" style="margin-top:16px;">
                            <button type="submit" class="btn btn-primary">💾 Save Asset</button>
                            <a th:href="@{/admin/assets}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body></html>
